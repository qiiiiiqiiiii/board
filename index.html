<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>壁面ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0D12; --rule:#1C222C; --amber:#FFB01F;
    --paper:#EDEAE3; --dim:#5E6976; --alert:#FF4A35;
    --cond:"Barlow Condensed","Helvetica Neue",Arial,sans-serif;
    --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;padding:8px}
  .board{
    width:100%;
    max-width:min(100%, 56vh);
    max-width:min(100%, 56dvh);
    aspect-ratio:1080/1920;
    container-type:size;
    background:var(--ink);color:var(--paper);
    font-family:var(--body);font-feature-settings:"tnum";
    display:flex;flex-direction:column;
    padding:5.2cqw 4.1cqw 3.7cqw;
    transition:filter 4s linear;
  }
  .board.night{filter:brightness(.4)}

  /* ── header ── */
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:2cqw;
    font-family:var(--cond);font-weight:600;letter-spacing:.02em}
  .head .day{font-size:5.9cqw;white-space:nowrap}
  .head .day em{font-style:normal;color:var(--dim);margin-left:1.3cqw;font-size:4.8cqw}
  .head .wx{font-size:3.9cqw;color:var(--dim);white-space:nowrap;
    font-variant-numeric:tabular-nums;flex:1;text-align:center}
  .head .clk{font-size:5.9cqw;color:var(--amber);
    font-variant-numeric:tabular-nums;white-space:nowrap}

  .hr{height:.19cqw;background:var(--rule);margin:2.6cqw 0;flex-shrink:0}

  /* ── overdue ── */
  .late{display:flex;align-items:center;gap:2.2cqw;
    border-left:1.1cqw solid var(--alert);
    padding:1.3cqw 0 1.3cqw 2.4cqw;margin-bottom:3.1cqw}
  .late .tag{font-family:var(--cond);font-weight:700;font-size:4.1cqw;
    color:var(--alert);letter-spacing:.06em;line-height:1;flex-shrink:0}
  .late .txt{font-size:8.1cqw;font-weight:700;color:var(--alert);line-height:1.1}

  /* ── today ── */
  .eyebrow{display:flex;align-items:baseline;justify-content:space-between;
    font-family:var(--cond);font-weight:700;font-size:4.8cqw;
    letter-spacing:.22em;color:var(--amber);margin-bottom:2cqw}
  .eyebrow .prog{letter-spacing:.06em;color:var(--dim)}
  .eyebrow .prog b{color:var(--amber);font-weight:700}
  .today li{list-style:none;font-size:12.2cqw;font-weight:900;
    line-height:1.34;letter-spacing:.01em}
  .today li .hm{font-family:var(--cond);font-weight:700;color:var(--amber);
    font-size:.62em;margin-right:.28em;font-variant-numeric:tabular-nums;
    letter-spacing:.02em}
  .today.dense li{font-size:8.8cqw;line-height:1.26}
  .today li.fin{font-size:8.4cqw;font-weight:500;color:var(--dim);
    text-decoration:line-through;text-decoration-color:var(--dim);
    text-decoration-thickness:.4cqw;line-height:1.45}
  .today .none{font-size:7cqw;font-weight:500;color:var(--dim)}
  .more{font-family:var(--cond);font-weight:600;font-size:4.4cqw;
    color:var(--dim);letter-spacing:.08em;margin-top:1cqw}

  /* ── timeline ── */
  .rows{flex:1;display:flex;flex-direction:column;justify-content:flex-start}
  .grp{font-family:var(--cond);font-weight:600;font-size:3.6cqw;
    color:var(--dim);letter-spacing:.26em;padding:1.6cqw 0 .6cqw}
  .row.brk{border-top:.7cqw solid var(--rule);margin-top:2cqw;padding-top:3.4cqw}
  .row .d.rel{font-family:var(--body);font-weight:700;font-size:6.2cqw}
  .row{display:grid;grid-template-columns:19.4cqw 7cqw auto 1fr;
    align-items:baseline;gap:1.5cqw;padding:3cqw 0;
    border-bottom:.19cqw solid var(--rule)}
  .row .hm:empty{display:none}
  .row .hm:empty + .t{margin-left:-1.5cqw}
  .row .hm{font-family:var(--cond);font-weight:700;font-size:5.6cqw;
    line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
  .row.far .hm{color:var(--dim)}
  .row.done .hm{color:var(--dim)}
  .row .d{font-family:var(--cond);font-weight:700;font-size:7.8cqw;
    line-height:1;font-variant-numeric:tabular-nums}
  .row .w{font-family:var(--cond);font-weight:600;font-size:4.1cqw;
    color:var(--dim);line-height:1}
  .row .t{font-size:8.5cqw;font-weight:700;line-height:1.16;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;word-break:break-word}
  .row.soon .d,.row.soon .t{color:var(--amber)}
  .row.far .d,.row.far .t{color:var(--dim)}
  .row.far .t{font-weight:500}
  .row.done .d,.row.done .t{color:var(--dim);text-decoration:line-through;
    text-decoration-thickness:.4cqw;font-weight:500}

  /* ── footer ── */
  .someday{margin-top:2.4cqw}
  .someday .lab{font-family:var(--cond);font-weight:700;font-size:3.6cqw;
    letter-spacing:.24em;color:var(--dim);margin-bottom:1.2cqw}
  .someday li{list-style:none;font-size:6cqw;font-weight:500;
    color:var(--dim);line-height:1.42;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

  .foot{display:flex;justify-content:space-between;align-items:center;
    font-family:var(--cond);font-weight:500;font-size:3.5cqw;
    color:var(--dim);letter-spacing:.08em;padding-top:2.4cqw}
  .foot.stale,.foot.stale .dot{color:var(--alert)}
  .foot.stale .dot{background:var(--alert)}
  .dot{width:1.5cqw;height:1.5cqw;border-radius:50%;background:var(--amber);
    display:inline-block;margin-right:1.3cqw;vertical-align:middle}
  @media (prefers-reduced-motion:no-preference){
    .dot{animation:p 4s ease-in-out infinite}
    @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
  }
</style>
</head>
<body>
<div class="board" id="board">
  <div class="head">
    <div class="day" id="day">—</div>
    <div class="wx"  id="wx"></div>
    <div class="clk" id="clk">--:--</div>
  </div>
  <div class="hr"></div>

  <div id="lateBox"></div>

  <div class="eyebrow">
    <span>TODAY</span>
    <span class="prog" id="prog"></span>
  </div>
  <ul class="today" id="today"><li class="none">読み込み中…</li></ul>
  <div class="more" id="more"></div>
  <div id="sdBox"></div>

  <div class="hr"></div>
  <div class="rows" id="rows"></div>

  <div class="foot" id="foot">
    <span><span class="dot"></span><span id="upd">—</span></span>
    <span id="status">—</span>
  </div>
</div>

<script>
/* ══════════ 設定 / 只需要改这里 ══════════ */
const CONFIG = {
  apiUrl: "https://board-api.yidilaning.workers.dev/",

  refreshMinutes: 10,     // 拉取间隔
  maxToday: 5,            // 今日最多显示几条
  maxUpcoming: 5,         // 时间轴最多几行
  maxSomeday: 3,          // 底部「SOMEDAY」最多几条
  overdueLookbackDays: 7, // 过期超过这个天数就不再报警(视为已作废)

  staleAfterMinutes: 30,  // 超过多久没同步成功就报警

  nightStart: 22,         // 夜间变暗 開始(時)
  nightEnd:   6,          // 夜间变暗 終了(時)

  weather: { lat: 35.6718, lon: 139.8540 }  // 江戸川区西葛西。改坐标即可换地点
};
const DONE_MARK  = /^\s*[✓✔☑]\s*/;  // 旧方式(互換のため残す)
const DONE_COLOR = '8';              // 予備(公開読み取りでは返らない)
const DONE_DESC  = /\bDONE\b/;        // 本命:説明欄に DONE = 完了
/* ═══════════════════════════════════════ */

const WD = ['日','月','火','水','木','金','土'];
let lastOK = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function ymd(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')
       +'-'+String(d.getDate()).padStart(2,'0');
}
function parse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function diffDays(s){
  const t=new Date(); t.setHours(0,0,0,0);
  return Math.round((parse(s)-t)/86400000);
}
function hhmm(d){
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* ── 時計・夜間・焼き付き防止 ── */
function tick(){
  const n = new Date();
  $('clk').textContent = hhmm(n);
  $('day').innerHTML = (n.getMonth()+1)+'月'+n.getDate()+'日<em>'+WD[n.getDay()]+'</em>';

  const h = n.getHours();
  const night = CONFIG.nightStart > CONFIG.nightEnd
    ? (h >= CONFIG.nightStart || h < CONFIG.nightEnd)
    : (h >= CONFIG.nightStart && h < CONFIG.nightEnd);
  $('board').classList.toggle('night', night);

  // 焼き付き防止:10分ごとに数ピクセル動かす
  const step = Math.floor(n.getTime()/600000) % 4;
  $('board').style.transform = 'translate('+step+'px,'+step+'px)';

  // 同期が古いと赤
  if(lastOK){
    const stale = (Date.now()-lastOK)/60000 > CONFIG.staleAfterMinutes;
    $('foot').classList.toggle('stale', stale);
    if(stale) $('status').textContent = 'SYNC STALE';
  }
}

/* ── データ取得 ── */
async function fetchEvents(){
  const res = await fetch(CONFIG.apiUrl, { cache: 'no-store' });
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();
  if(!data.ok) throw new Error(data.err || 'API ERROR');
  return (data.items||[]).map(t => ({
    summary: t.title,
    date: t.date,
    time: t.time || '',
    done: !!t.done,
    someday: !!t.someday,
    rid: null
  })).filter(e => e.date || e.someday);
}

async function fetchWeather(){
  const {lat,lon} = CONFIG.weather;
  const url = 'https://api.open-meteo.com/v1/forecast'
    + '?latitude='+lat+'&longitude='+lon
    + '&current=temperature_2m'
    + '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max'
    + '&timezone=Asia%2FTokyo&forecast_days=1';
  const res = await fetch(url);
  if(!res.ok) return;
  const d = await res.json();
  const cur = Math.round(d.current.temperature_2m);
  const hi  = Math.round(d.daily.temperature_2m_max[0]);
  const lo  = Math.round(d.daily.temperature_2m_min[0]);
  const pop = d.daily.precipitation_probability_max[0];
  $('wx').textContent = cur+'°   '+hi+' / '+lo+'   ☂ '+pop+'%';
}

/* ── 描画 ── */
function render(items){
  // 繰り返し予定は直近の1件だけ(API は日付順で返る)
  const seen = new Set();
  items = items.filter(e => {
    if(!e.rid) return true;
    if(seen.has(e.rid)) return false;
    seen.add(e.rid); return true;
  });

  const late=[], today=[], up=[], sd=[];
  items.forEach(e => {
    if(e.someday){ sd.push(e); return; }
    const d = diffDays(e.date);
    if(d < 0){ if(!e.done && d >= -CONFIG.overdueLookbackDays) late.push(e); }
    else if(d === 0) today.push(e);
    else up.push({...e, d});
  });

  // 遅延
  $('lateBox').innerHTML = late.length
    ? '<div class="late"><div class="tag">遅延</div><div class="txt">'
      + esc(late[late.length-1].summary)
      + (late.length>1 ? ' +'+(late.length-1) : '')
      + '</div></div>'
    : '';

  // 今日:未完了だけ表示、完了は進捗に数える
  const open = today.filter(e => !e.done)
    .sort((a,b) => (a.time?'0'+a.time:'1').localeCompare(b.time?'0'+b.time:'1'));
  const doneN = today.length - open.length;
  $('prog').innerHTML = today.length
    ? '<b>'+doneN+'</b> / '+today.length : '';

  const tEl = $('today');
  const shownOpen = open.slice(0, CONFIG.maxToday);
  tEl.className = 'today' + (shownOpen.length >= 4 ? ' dense' : '');

  let tHtml = shownOpen.map(e =>
    '<li>' + (e.time ? '<span class="hm">'+e.time+'</span>' : '')
           + esc(e.summary) + '</li>').join('');
  // 完了ぶんは下に打ち消し線で
  // 余裕があれば完了分を打ち消し線で残す(今日だけ)
  const slots = CONFIG.maxToday - shownOpen.length;
  const fin = today.filter(e => e.done).slice(0, Math.max(0, slots));
  tHtml += fin.map(e=>'<li class="fin">'+esc(e.summary)+'</li>').join('');

  tEl.innerHTML = tHtml || (today.length
    ? '<li class="none">本日分 完了 ✓</li>' : '<li class="none">予定なし</li>');

  const hidden = open.length - shownOpen.length;
  const finHidden = today.filter(e=>e.done).length - fin.length;
  const bits = [];
  if(hidden)    bits.push('+ '+hidden+' 件');
  if(finHidden) bits.push('✓ '+finHidden);
  $('more').textContent = bits.join('    ');

  // 時間軸:今週 / 以降 で区切る
  const shown = up.slice(0, CONFIG.maxUpcoming);
  let html = '', wasNear = null;
  shown.forEach(e => {
    const near = e.d <= 7;
    const dt = parse(e.date);
    let cls = e.done ? 'done' : (near ? 'soon' : (e.d <= 30 ? '' : 'far'));
    // 7日以内 と それ以降 の境目に太い区切り線
    if(wasNear === true && near === false) cls += ' brk';
    wasNear = near;
    const dCell = e.d === 1
      ? '<div class="d rel">明日</div>'
      : '<div class="d">'+String(dt.getMonth()+1).padStart(2,'0')+'/'
                         +String(dt.getDate()).padStart(2,'0')+'</div>';
    html += '<div class="row '+cls+'">'
      + dCell
      + '<div class="w">'+WD[dt.getDay()]+'</div>'
      + (e.time ? '<div class="hm">'+e.time+'</div>' : '<div class="hm"></div>')
      + '<div class="t">'+esc(e.summary)+'</div></div>';
  });
  const restN = up.length - shown.length;
  if(restN) html += '<div class="grp">+ '+restN+' 件</div>';
  $('rows').innerHTML = html;

  // ── いつか(締切なし)──
  const sdShown = sd.slice(0, CONFIG.maxSomeday);
  const sdMore = sd.length - sdShown.length;
  $('sdBox').innerHTML = sdShown.length
    ? '<div class="someday"><div class="lab">SOMEDAY'
      + (sdMore ? '　+' + sdMore : '') + '</div><ul>'
      + sdShown.map(e => '<li>'+esc(e.summary)+'</li>').join('')
      + '</ul></div>'
    : '';
}

async function sync(){
  try{
    render(await fetchEvents());
    lastOK = Date.now();
    $('foot').classList.remove('stale');
    $('upd').textContent = 'UPDATED '+hhmm(new Date());
    $('status').textContent = 'NEXT SYNC '+CONFIG.refreshMinutes+' MIN';
  }catch(err){
    $('foot').classList.add('stale');
    $('status').textContent = 'SYNC ERROR — '+err.message;
  }
  fetchWeather().catch(()=>{});
}

tick(); setInterval(tick, 20000);
sync(); setInterval(sync, CONFIG.refreshMinutes*60000);
</script>
</body>
</html>
